<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Vanilla SPA</title>
    <!-- iOS stylesheet styling system -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- iOS Container Simulator -->
    <div class="ios-app-container">

        <!-- iOS Status Bar -->
        <div class="ios-status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <!-- Signal SVG -->
                <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="0.5"/>
                    <rect x="4.5" y="6" width="3" height="6" rx="0.5"/>
                    <rect x="9" y="3" width="3" height="9" rx="0.5"/>
                    <rect x="13.5" y="0" width="3" height="12" rx="0.5"/>
                </svg>
                <!-- Wifi SVG -->
                <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
                    <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-4.24-2.83a6 6 0 018.48 0l-1.41 1.41a4 4 0 00-5.66 0L3.76 6.67zM.93 3.84a10 10 0 0114.14 0l-1.41 1.41a8 8 0 00-11.32 0L.93 3.84z"/>
                </svg>
                <!-- Battery SVG -->
                <svg width="22" height="11" viewBox="0 0 22 11" fill="currentColor">
                    <rect x="0" y="0" width="18" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/>
                    <rect x="2" y="2" width="14" height="7" rx="1.5"/>
                    <path d="M19 4v3a1.5 1.5 0 000-3z"/>
                </svg>
            </div>
        </div>

        <!-- iOS Navigation Bar / Header -->
        <header class="ios-header">
            <h1 id="header-title">Home</h1>
        </header>

        <!-- Main Scrollable Content Area -->
        <main class="root">
            <!-- Dynamic page content will be injected here safely by Router -->
        </main>

        <!-- iOS Bottom Tab Bar Navigation -->
        <nav class="ios-tab-bar">
            <!-- Home Link -->
            <a class="navLink active" href="/home" aria-label="Home">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>Home</span>
            </a>

            <!-- Index / Overview Link -->
            <a class="navLink" href="/" aria-label="Index">
                <svg viewBox="0 0 24 24">
                    <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                </svg>
                <span>Index</span>
            </a>

            <!-- About Link -->
            <a class="navLink" href="/about" aria-label="About">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <span>About</span>
            </a>
        </nav>
    </div>

    <!-- Application Script Module -->
    <script src="App.js" type="module" async></script>
</body>
</html>
