<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Web Application</title>
    <!-- iOS / Apple Design System CSS for Full Layout Desktop Website -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full Layout Wrapper -->
    <div class="desktop-app-wrapper">

        <!-- Desktop Top Header Navigation Bar -->
        <header class="desktop-navbar">
            <div class="desktop-nav-container">
                <a href="/home" class="desktop-brand">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>
                    </svg>
                    <span>Portal Application</span>
                </a>

                <nav class="desktop-nav-links">
                    <a class="navLink active" href="/home" aria-label="Home">
                        <svg viewBox="0 0 24 24">
                            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                        </svg>
                        <span>Home</span>
                    </a>

                    <a class="navLink" href="/" aria-label="Index">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                        </svg>
                        <span>Index</span>
                    </a>

                    <a class="navLink" href="/about" aria-label="About">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                        </svg>
                        <span>About</span>
                    </a>
                </nav>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="root">
            <!-- Dynamic page content injected safely by Router -->
        </main>

        <!-- Desktop Footer -->
        <footer class="desktop-footer">
            <p>&copy; 2026 Portal Single Page Application. Built with Vanilla JS & Apple Web Design System.</p>
        </footer>

    </div>

    <!-- Application Script Module -->
    <script src="App.js" type="module" async></script>
</body>
</html>
